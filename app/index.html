<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CEAMLS Building Damage Screening</title>
<style>body{font:16px system-ui,sans-serif;max-width:700px;margin:2rem auto;padding:0 1rem;line-height:1.55;color:#142034}h1{font-size:2rem}label{display:block;margin-top:1rem;font-weight:600}input{display:block;margin-top:.4rem}button{margin-top:1rem;background:#0767a7;border:0;border-radius:.4rem;padding:.8rem 1.2rem;color:#fff;cursor:pointer}#result{margin-top:1.5rem;padding:1rem;border:1px solid #cbd5e1;border-radius:.5rem;white-space:pre-line}.warning{background:#fffbeb;border-left:4px solid #d97706;padding:.8rem}</style></head>
<body><h1>Building Damage Screening</h1>
<p class="warning"><strong>Research prototype only.</strong> Predictions do not establish that a building is safe to occupy. An ATC-20 assessment requires authorized professional inspection.</p>
<form id="form"><label for="post">Post-disaster image (required)</label><input id="post" name="file" type="file" accept=".tif,.tiff,.jpg,.jpeg,.png" required>
<label for="pre">Pre-disaster image (required for Siamese models)</label><input id="pre" name="pre_file" type="file" accept=".tif,.tiff,.jpg,.jpeg,.png">
<button type="submit">Analyze image</button></form><div id="result" aria-live="polite">Choose an image to begin.</div>
<script>
const form=document.getElementById('form'),result=document.getElementById('result');
form.addEventListener('submit',async event=>{event.preventDefault();result.textContent='Processing…';const data=new FormData(form);if(!document.getElementById('pre').files.length)data.delete('pre_file');try{const response=await fetch('/classify',{method:'POST',body:data});const value=await response.json();if(!response.ok)throw Error(value.detail||'Request failed');result.textContent=`Damage class: ${value.damage_class}\nScreening priority: ${value.screening_priority}\nEstimated model probability: ${(value.model_probability*100).toFixed(1)}%\n\n${value.disclaimer}`;}catch(error){result.textContent='Error: '+error.message;}});
</script></body></html>
